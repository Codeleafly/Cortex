[package]
name = "nox-runtime"
version = "1.0.1"
edition = "2021"

[dependencies]
home = "0.5.12"
md5 = "0.8.0"
nox-shared = { path = "../shared" }
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.35", features = ["full"] }
